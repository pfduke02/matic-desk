[project]
name = "matic-desk"
version = "0.1.0"
description = "Unofficial macOS menu bar app, CLI and MCP server for Matic robot vacuums. Local network only."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
  "grpclib==0.4.9",
  "h2>=4",
  "protobuf>=6",
  "cryptography>=44",
  "Pillow>=11",
  "numpy>=2.3",
  "mcp>=1.10,<2",
  "bleak>=1.0",
]

[project.scripts]
matic-desk = "matic_desk.cli:main"
matic-desk-mcp = "matic_desk.mcp_server:main"
matic-desk-bridge = "matic_desk.bridge:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matic_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
